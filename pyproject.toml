[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "locust-scale-framework"
version = "0.1.0"
description = "Reduced Locust performance and scale testing framework prototype"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.115.12",
  "gevent==24.11.1",
  "locust==2.37.14",
  "prometheus-client==0.21.1",
  "PyYAML==6.0.2",
  "uvicorn==0.34.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
  "ruff==0.11.13",
]

[tool.setuptools.packages.find]
include = ["perf_framework*", "simulator*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
